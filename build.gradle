plugins {
	id 'base'
	id "de.inetsoftware.setupbuilder" version "8.4.22"
	id 'edu.sc.seis.launch4j' version '4.0.0'
}

// The platform defaults to the build machine. Override it with -PtargetOs=macos|windows|linux and
// -PtargetArch=aarch64|x64, for example to build the Intel macOS installer on an Apple Silicon Mac.
def hostOsName = System.getProperty('os.name').toLowerCase()
def targetOs = project.findProperty('targetOs') ?: (hostOsName.contains('mac') ? 'macos' : hostOsName.contains('win') ? 'windows' : 'linux')
def targetArch = project.findProperty('targetArch') ?: (System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'aarch64' : 'x64')
if (!(targetOs in ['macos', 'windows', 'linux'])) {
	throw new GradleException("Unsupported targetOs '${targetOs}'. Use macos, windows or linux.")
}
if (!(targetArch in ['aarch64', 'x64'])) {
	throw new GradleException("Unsupported targetArch '${targetArch}'. Use aarch64 or x64.")
}

def resourceDir = 'build-resources'
// The files to install are staged per platform, so that files added for one platform
// (such as the Windows launcher) don't end up in another platform's installer.
def tempDir = "build/tmp/app-${targetOs}"

def artifactName = "dotify-studio"
def appBase = "${tempDir}/dotify-studio"

configurations {
	app
	appPlugins
}

repositories {
    mavenCentral()
    // Needed until the Java 21 build of dotify-studio is released.
    // Run './gradlew publishToMavenLocal' in dotify-studio first.
    mavenLocal()
}

dependencies {
	app ("org.daisy.dotify:$artifactName:$dotifyStudioVersion@zip") {
		transitive = false
	}
	appPlugins ('se.mtm.addons:mtm-dotify-addons:4.0.0') {
		transitive = false
	}
}

task unzip(type: Copy, description: 'Unzips the distribution to a temporary folder.') {
    from zipTree(file(configurations.app.iterator().next()))
    into file("${tempDir}")
    eachFile {details ->
		def targetPath = modifyPath(details.path)
		details.path = targetPath
	}
}

task unzipFlatLib(type: Copy, description: 'Unzips the distribution to a temporary folder.') {
	from zipTree(file(configurations.app.iterator().next()))
	into file("${tempDir}")
	eachFile {details ->
		def targetPath = modifyPathFlatLib(details.path)
		details.path = targetPath
	}
}

task copyPlugins(type: Copy, dependsOn: 'unzip', description: 'Copies additional jars to the plugins folder (requires editing of build.gradle)') {
	from configurations.appPlugins
	into file("${appBase}/lib/plugins")
}

task copyPluginsFlatLib(type: Copy, dependsOn: 'unzipFlatLib', description: 'Copies additional jars to the plugins folder (requires editing of build.gradle)') {
	from configurations.appPlugins
	into file("${appBase}/plugins")
}

def modifyPath(def path) {
	def modified=path.replaceAll('\\Adotify-studio[^/]*(.+)', {"dotify-studio${it[1]}"})
	return modified
}

def modifyPathFlatLib(def path) {
	def modified=path.replaceAll('\\Adotify-studio[^/]*(.+)', {"dotify-studio${it[1]}"})
	// Remove the 'lib' part of the path because the app.mainjar property of the cfg file that java packager generates cannot be set.
	return modified.replaceAll('\\Adotify-studio/lib/(.*)', {"dotify-studio/${it[1]}"})
}

task copyIcon(type: Copy, dependsOn: 'unzip', description: 'Copies file icon to distribution.') {
	from ("${resourceDir}") {
		include 'favicon.ico'
	} 
	into ("${appBase}")
}

task copyExe(type: Copy, dependsOn: 'createExe') {
	from ('build/launch4j') {
		include '*.exe'
	} 
	into ("${appBase}")
}

task deleteBin(type: Delete, dependsOn: 'unzip', description: 'Removes the bin folder from the distribution.') {
	delete "${appBase}/bin"
}

task deleteBinFlatLib(type: Delete, dependsOn: 'unzipFlatLib', description: 'Removes the bin folder from the distribution.') {
	delete "${appBase}/bin"
}

def launch4jManifest = file("$buildDir/launch4j.manifest") 

task createLaunch4jManifest(description: 'Creates the Launch4j manifest from a template.') {
	doLast() {
		String contents = file('build-resources/launch4j.manifest').getText('UTF-8')
		launch4jManifest.getParentFile().mkdirs()
		launch4jManifest.write(contents.replaceAll('(<assemblyIdentity.+? version=")([\\d\\.A-Za-z\\-]+)("\\/>)', "\$1$version.0\$3"), 'UTF-8')
	}
	outputs.file launch4jManifest
	outputs.upToDateWhen{ file('gradle.properties').lastModified()<file(launch4jManifest).lastModified() }
}

// createExe reads the jar from the staged files, so stage them first.
createExe.dependsOn('createLaunch4jManifest', 'unzip', 'deleteBin', 'copyIcon', 'copyPlugins')

// A Java 21 runtime that includes JavaFX (Azul Zulu FX) is bundled with the macOS and Windows installers.
def jreVersion = '21'
def jreDir = layout.buildDirectory.dir("jre/${targetOs}-${targetArch}").get().asFile

task downloadJre(description: 'Downloads a Java runtime with JavaFX for the target platform.') {
	inputs.property('targetOs', targetOs)
	inputs.property('targetArch', targetArch)
	outputs.dir jreDir
	doLast {
		def os = targetOs
		def arch = targetArch
		def query = "https://api.azul.com/metadata/v1/zulu/packages/?java_version=${jreVersion}&os=${os}&arch=${arch}" +
			"&java_package_type=jre&javafx_bundled=true&archive_type=zip&latest=true&release_status=ga&availability_types=CA&page_size=1"
		def packages = new groovy.json.JsonSlurper().parse(URI.create(query).toURL())
		if (!packages) {
			throw new GradleException("No Java ${jreVersion} runtime with JavaFX found for ${os}/${arch}")
		}
		def zip = new File(temporaryDir, packages[0].name)
		logger.lifecycle("Downloading ${packages[0].download_url}")
		zip.withOutputStream { out -> URI.create(packages[0].download_url).toURL().withInputStream { out << it } }
		project.delete(jreDir)
		project.copy {
			from zipTree(zip)
			into jreDir
		}
	}
}

// The runtime's home folder (the one that contains bin/java) inside the downloaded archive.
def jreHome = {
	def java = fileTree(jreDir).matching { include '**/bin/java', '**/bin/java.exe' }.files
	if (java.isEmpty()) {
		throw new GradleException("No Java runtime found in ${jreDir}. Run the downloadJre task.")
	}
	return java.iterator().next().parentFile.parentFile
}

setupBuilder {
    vendor = 'DAISY Consortium'
    application = releaseName
    appIdentifier = artifactName
    description = 'Creates, manages and embosses PEF-files'
    mainJar = "lib/${artifactName}-${dotifyStudioVersion}.jar"
    mainClass = 'application.ui.Launcher'
    //licenseFile = 'license.txt'
    // icons in different sizes for different usage. you can also use a single *.ico or *.icns file
	icons = ['build-resources/app-icon.ico']
    // files for all platforms
    from ("${appBase}") {
        include '**/*'
    }
    failOnEmptyFrom=true
}

launch4j {
	mainClassName = 'application.ui.Launcher'
	dontWrapJar = true
	icon = file('build-resources/app-icon.ico').absolutePath
	manifest = launch4jManifest.absolutePath
	jarFiles = files("${appBase}/lib/${artifactName}-${dotifyStudioVersion}.jar")
	libraryDir = 'lib'
	copyConfigurable = files()
	outfile = 'dotify-studio.exe'
	bundledJrePath = 'jre'
	// Without this, launch4j requires the Java version that runs Gradle, which can be newer than
	// the bundled runtime. The exe then refuses to start ("requires a Java Runtime Environment").
	jreMinVersion = jreVersion
	requires64Bit = true
}

configure( [msi] ) {
    // included to reduce the build time
    languages = ['en-US']
    wxsTemplate = './build-resources/template.wxs'

    doFirst {
        setupBuilder {
		    desktopStarter {
		    	displayName = releaseName
        		description = appDescription
		        executable = "dotify-studio.exe"
		        location = "ApplicationMenu"
		    }
		    bundleJre = jreHome()
        }
    }
}

msi {
	classifier = "windows-${targetArch}"
}

def macArch = targetArch == 'aarch64' ? 'arm64' : 'x86_64'

dmg {
	classifier = targetArch == 'aarch64' ? 'macos-apple-silicon' : 'macos-intel'
	// The default list is for Java 8 and leaves out conf/, which Java 9 and later need.
	jreIncludes = ['bin/**', 'conf/**', 'legal/**', 'lib/**', 'release']
	// Match the bundled runtime. Otherwise macOS may start the Intel launcher (via Rosetta)
	// on Apple Silicon, which cannot load an arm64 runtime ("Unable to load Java Runtime Environment").
	architecture = [macArch]
	// setupbuilder writes an uncompressed image. Fix up the app inside it, then compress it.
	//
	// For distribution, pass -PmacSigningIdentity="Developer ID Application: <name> (<team id>)"
	// to sign the app and the image, and -PmacNotaryProfile=<profile> to also notarize the image
	// (create the profile with 'xcrun notarytool store-credentials <profile>'). Without them the
	// image works on the Mac that built it, but macOS blocks it after it has been downloaded.
	def signingIdentity = project.findProperty('macSigningIdentity')
	def notaryProfile = project.findProperty('macNotaryProfile')
	def signScript = file('scripts/sign-mac-app.sh').absolutePath
	inputs.property('macSigningIdentity', signingIdentity ?: '')
	inputs.property('macNotaryProfile', notaryProfile ?: '')
	doFirst {
		if (notaryProfile && (!signingIdentity || signingIdentity == '-')) {
			throw new GradleException('Notarizing requires -PmacSigningIdentity with a Developer ID certificate')
		}
	}
	doLast {
		def run = { List<String> cmd ->
			def process = new ProcessBuilder(cmd).inheritIO().start()
			if (process.waitFor() != 0) {
				throw new GradleException("Command failed: ${cmd.join(' ')}")
			}
		}
		[setupFile].each { image ->
			def writable = new File(temporaryDir, 'rw.dmg')
			def mountPoint = new File(temporaryDir, 'mnt')
			def compressed = new File(temporaryDir, image.name)
			project.delete(writable, mountPoint, compressed)
			run(['hdiutil', 'convert', image.absolutePath, '-format', 'UDRW', '-o', writable.absolutePath])
			if (signingIdentity) {
				// Make room for the signatures. Free space compresses to almost nothing.
				run(['hdiutil', 'resize', '-size', '1g', writable.absolutePath])
			}
			run(['hdiutil', 'attach', writable.absolutePath, '-nobrowse', '-noautoopen', '-mountpoint', mountPoint.absolutePath])
			try {
				// The launcher is a universal binary, but the bundled runtime only has one architecture.
				// Keep only the matching slice: if the user has "Open using Rosetta" set for the app
				// (for example left over from an older Intel-only version), macOS would otherwise start
				// the Intel launcher, which fails with "Unable to load Java Runtime Environment".
				fileTree(mountPoint) { include '*.app/Contents/MacOS/*' }.each { launcher ->
					def archs = ['lipo', '-archs', launcher.absolutePath].execute().text.trim().split(/\s+/) as List
					if (!archs.contains(macArch)) {
						throw new GradleException("${launcher} has ${archs}, but the bundled runtime needs ${macArch}")
					}
					if (archs.size() > 1) {
						run(['lipo', launcher.absolutePath, '-thin', macArch, '-output', launcher.absolutePath])
					}
				}
				if (signingIdentity) {
					fileTree(mountPoint) { include '*.app/Contents/Info.plist' }.each { plist ->
						run([signScript, plist.parentFile.parentFile.absolutePath, signingIdentity])
					}
				}
			} finally {
				run(['hdiutil', 'detach', mountPoint.absolutePath])
			}
			run(['hdiutil', 'convert', writable.absolutePath, '-format', 'UDZO', '-o', compressed.absolutePath])
			java.nio.file.Files.move(compressed.toPath(), image.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			project.delete(writable)
			if (signingIdentity && signingIdentity != '-') {
				run(['codesign', '--force', '--timestamp', '--sign', signingIdentity, image.absolutePath])
			}
			if (notaryProfile) {
				run(['xcrun', 'notarytool', 'submit', image.absolutePath, '--keychain-profile', notaryProfile, '--wait'])
				run(['xcrun', 'stapler', 'staple', image.absolutePath])
				run(['spctl', '--assess', '--type', 'open', '--context', 'context:primary-signature', '-v', image.absolutePath])
			}
		}
	}
}

configure( [dmg] ) {
	doFirst {
		setupBuilder {
			desktopStarter {
				displayName = releaseName
				description = appDescription
			}
			bundleJre = jreHome()
		}
	}
}

configure( [deb, rpm] ) {
    doFirst {
        setupBuilder {
		defaultResourceLanguage 'en'
		longDescription 'build-resources/longDesc_en.txt'
		desktopStarter {
			displayName = releaseName
        	description = appDescription
			executable = "bin/dotify-studio"
			location = "ApplicationMenu"
			categories = "Office"
		}
        }
    }
}

msi.dependsOn('downloadJre', 'unzip', 'deleteBin', 'copyIcon', 'copyPlugins', 'copyExe')
dmg.dependsOn('downloadJre', 'unzip', 'copyPlugins')
deb.dependsOn('unzip', 'copyPlugins')
rpm.dependsOn('unzip', 'copyPlugins')

deb {
    maintainerEmail = 'joel.hakansson@mtm.se'
    section = 'text'
    postinst = 'chmod +x /usr/share/dotify-studio/bin/dotify-studio'
}

rpm {
    postinst = 'chmod +x /usr/share/dotify-studio/bin/dotify-studio'
}

wrapper {
	distributionType = Wrapper.DistributionType.ALL
}
